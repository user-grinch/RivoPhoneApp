pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "Rivo4"
include ':app'

def externalBuildDir = System.getenv("GRADLE_BUILD_DIR")
if (!externalBuildDir && System.getenv("CI") == null && System.getenv("GITHUB_ACTIONS") == null) {
    externalBuildDir = "${System.getProperty("user.home")}/.gradle-builds/${rootProject.name}"
}
if (externalBuildDir) {
    gradle.beforeProject { proj ->
        if (proj == proj.rootProject) {
            proj.layout.buildDirectory.set(new File(externalBuildDir, "root"))
        } else {
            proj.layout.buildDirectory.set(new File(externalBuildDir, proj.name))
        }
    }
}
