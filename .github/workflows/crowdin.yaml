name: Crowdin Sync

on:
  push:
    branches:
      - main
    paths:
      - 'app/src/main/res/values/strings.xml'
      - 'crowdin.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      upload_existing_translations:
        description: 'Also upload the translations already in the repo (use once, when seeding a new Crowdin project)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync with Crowdin
        uses: crowdin/github-action@v2
        with:
          config: crowdin.yml
          upload_sources: true
          upload_translations: ${{ inputs.upload_existing_translations || false }}
          download_translations: true
          skip_untranslated_strings: true
          localization_branch_name: l10n_crowdin
          create_pull_request: true
          pull_request_base_branch_name: main
          pull_request_title: 'New translations from Crowdin'
          pull_request_body: 'Automatic sync of translations from Crowdin. Merging publishes them in the next preview build.'
          commit_message: 'Update translations from Crowdin'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
