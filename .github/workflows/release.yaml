name: Release

# Builds the signed FOSS APK for a version tag. F-Droid rebuilds the same tag and,
# because the build is reproducible, publishes this APK's signature on its own build.
# F-Droid builds without BUILD_NUMBER/PREVIEW_BUILD, so versionCode gets no bump there.
# BUILD_NUMBER is pinned to 0 below to keep GITHUB_RUN_NUMBER from bumping it here.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Build FOSS Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ../app/keystore.jks
          BUILD_NUMBER: "0"
          GRADLE_OPTS: "-Xmx4096m -XX:+UseParallelGC"
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties
          ./gradlew --no-daemon assembleFossRelease -PdefaultBuildDir

      - name: Collect outputs
        run: |
          mkdir -p outputs
          cp app/build/outputs/apk/foss/release/*.apk outputs/
          cd outputs
          sha256sum *.apk > SHA256SUMS.txt
          ls -lah

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          artifacts: outputs/*
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}
